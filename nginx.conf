server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml;

    # Hashed build assets are safe to cache aggressively.
    location ~* \.(?:js|mjs|css|wasm|png|jpe?g|gif|svg|ico|webp|ttf|otf|woff2?|map)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Never cache the entry document so new builds are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Flutter web bootstrap + service worker.
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths are handled by the Flutter router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
